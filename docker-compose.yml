services:
  nginx:
    image: nginx:1.29.5
    volumes:
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      app:
        condition: service_healthy
        restart: true
    ports:
      - "80:80"
    networks:
      - fastapi-jobs-net
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://127.0.0.1:3000/api/utils/healthcheck || exit 1",
        ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    env_file:
      - .env
    volumes:
      - ./backend/migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy
        restart: true
      queue:
        condition: service_healthy
        restart: true
    networks:
      - fastapi-jobs-net
  worker1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: celery -A app.worker worker --loglevel=INFO
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
        restart: true
      queue:
        condition: service_healthy
        restart: true
    networks:
      - fastapi-jobs-net
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: celery -A app.worker flower
    env_file:
      - .env
    ports:
      - "5555:5555"
    networks:
      - fastapi-jobs-net
  db:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    restart: always
    command:
      ["postgres", "-c", "log_statement=all", "-c", "log_destination=stderr"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - db-data:/var/lib/postgresql/data/pgdata
      - ./.docker/db:/docker-entrypoint-initdb.d
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${DB_PASSWORD?Variable not set}
      - POSTGRES_USER=${DB_USER?Variable not set}
      - POSTGRES_DB=${DB_NAME?Variable not set}
    ports:
      - "5432:5432"
    networks:
      - fastapi-jobs-net
  queue:
    hostname: rabbitmq
    image: rabbitmq:4.2.5-management
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 20s
      timeout: 30s
      retries: 5
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER?Variable not set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD?Variable not set}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST?Variable not set}
    ports:
      - "15672:15672"
    networks:
      - fastapi-jobs-net
volumes:
  db-data:
networks:
  fastapi-jobs-net:
